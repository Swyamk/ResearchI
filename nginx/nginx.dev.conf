events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    upstream web {
        server web:3000;
    }

    upstream ai_models {
        server ai_models:8001;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 25M;

        # API proxy
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # WebSocket proxy
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # AI Models API
        location /ai/ {
            proxy_pass http://ai_models/;
            proxy_read_timeout 120s;
        }

        # Static uploads
        location /uploads/ {
            alias /app/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # API Docs (dev only)
        location /docs { proxy_pass http://backend; }
        location /redoc { proxy_pass http://backend; }
        location /openapi.json { proxy_pass http://backend; }
        location /metrics { proxy_pass http://backend; }

        # Next.js frontend
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /health {
            proxy_pass http://backend/health;
        }
    }
}
