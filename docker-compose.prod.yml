# =============================================================================
# NutriMind – Docker Compose (Production)
# =============================================================================
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutrimind_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutrimind_network
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: nutrimind_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--auth", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutrimind_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: nutrimind_backend
    restart: always
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - model_weights:/app/weights
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutrimind_network
    deploy:
      resources:
        limits:
          memory: 1G
      replicas: 2

  ai_models:
    build:
      context: ./ai_models
      dockerfile: Dockerfile
    container_name: nutrimind_ai
    restart: always
    env_file:
      - .env
    volumes:
      - model_weights:/app/weights
      - ./uploads:/app/uploads
    networks:
      - nutrimind_network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: production
    container_name: nutrimind_web
    restart: always
    env_file:
      - .env
    networks:
      - nutrimind_network

  nginx:
    image: nginx:alpine
    container_name: nutrimind_nginx
    restart: always
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - web
    networks:
      - nutrimind_network

  certbot:
    image: certbot/certbot
    container_name: nutrimind_certbot
    volumes:
      - certbot_data:/var/www/certbot
      - ./nginx/ssl:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@nutrimind.app --agree-tos --no-eff-email -d nutrimind.app -d www.nutrimind.app

volumes:
  postgres_data:
  redis_data:
  model_weights:
  certbot_data:

networks:
  nutrimind_network:
    driver: bridge
