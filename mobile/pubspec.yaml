name: nutrimind_mobile
description: NutriMind – Personalized Multimodal Nutrition Intelligence System
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.7.0
  http: ^1.2.2

  # State management
  flutter_riverpod: ^2.5.3
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # Camera & Image
  camera: ^0.11.0
  image_picker: ^1.1.2
  image: ^4.2.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # UI & Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.1.3
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3

  # AI Chat
  dash_chat_2: ^0.0.21

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1

  # Forms
  reactive_forms: ^17.0.1

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  flutter_svg: ^2.0.10+1
  hugeicons: ^0.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
